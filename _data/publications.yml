main:

  - title: "The Political Economy of the Great Divergence"
    abstract: >
      This agenda seeks to explain China’s historical trajectory, especially how China evolved into a centralized bureaucratic state with an economy largely organized through capitalist markets.

    papers:
      - title: "Bureaucratization as a Bumpy Journey: The Rise and Fall of the Imperial Chinese State"
        authors: Shuyi Yu
        note: "JMP"
        pdf:  "/assets/pdf/bumpy.pdf"
        ssrn: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=6650979
        abstract: >
          Historians have long documented the rise and fall of the Imperial Chinese state. 
          This paper introduces bureaucratization as a potential mechanism underlying these processes. 
          I model the principal-agent problem inherent in state administration and identify two groups of agents available to the ruler: elites and bureaucrats. 
          Bureaucrats deliver higher returns to the ruler than elites because they can be monitored more effectively. 
          Socioeconomic and technological developments allow the ruler to monitor an increasing share of administrative tasks and reassign them from elites to bureaucrats. 
          Nonetheless, as bureaucrats gradually assume administrative duties, state capacity follows an N-shaped trajectory. 
          It first rises and then declines because expanding opportunities for bureaucratic delegation eventually weaken the credibility of the ruler’s relational contract with elites, 
          inducing them to withdraw effort and reducing the ruler’s aggregate payoff. 
          Historically, this decline aligns with the major downturn experienced by the late imperial Chinese state. 
          The model also predicts a resurgence of the modern Chinese state as bureaucratization reaches a more complete form. 
          I further discuss the potential applicability of the model to the historical development of European states. 

      - title: "The Curse of the Mandate of Heaven: A Model of Power Centralization"
        authors: Shuyi Yu

      - title: "Great Divergence and Great Convergence: A Theory of Power Dynamics and Social Evolution"
        authors: Shuyi Yu


  - title: "The Political Economy of the Autonomous State" (Under Review)
    abstract: >
      This agenda asks how effective governance can be sustained within a centralized bureaucratic state, whose logic may differ from conventional institutional prescriptions for Western democracies.
      
    papers:
      - title: "A Relational Theory of Power Alternation"
        authors: Zhaotian Luo, Zanhui Liu, Yucheng Qiu, Shuyi Yu
        pdf: "/assets/pdf/alternation.pdf"
        ssrn: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5192250
        abstract: >
          A long-standing thesis in political economy relates cooperation among rival elites to mechanisms for power alternation. 
          What remains unclear is why ruling elites would voluntarily transfer power if they can instead sustain cooperation by granting political concessions. 
          To resolve this puzzle, we study a setting without external enforcement in which two elite groups may cooperate repeatedly, 
          and the party in power can both make concessions and transfer power. 
          Incumbents cede power in equilibrium because power alternation disciplines concessions through continuation values under future incumbencies, 
          rather than inefficient punishments such as breakdowns of cooperation. 
          Efficient self-enforcing arrangements imply norms that maximize the stability of power, 
          with alternation occurring only when necessary to sustain cooperation. 
          Finally, as the cost of transferring power increases, alternation becomes more frequent and power stability deteriorates.

      - title: "Aristocratic and Bureaucratic Norms in Political Agency Relationship"
        authors: Zhaotian Luo, Zanhui Liu, Yucheng Qiu, Shuyi Yu

